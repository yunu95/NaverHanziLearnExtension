<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>네이버 한자 사전</title>
    <style>
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif;
            min-width: 260px;
            margin: 12px;
            background: #fff3cd;
            color: #7a1f1f;
            border: 4px solid #d62828;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 8px;
            resize: vertical;
            border: 2px solid #d62828;
            background: #fffdf7;
        }

        textarea:disabled {
            background: #ede0c4;
            color: #9e7b4a;
            cursor: not-allowed;
            border-color: #c4a46a;
        }

        .textarea-label {
            font-size: 12px;
            font-weight: bold;
            color: #7a1f1f;
            margin-bottom: 6px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        button {
            width: 100%;
            padding: 8px 12px;
            border: 0;
            background: #d62828;
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }

        button:hover {
            background: #b71c1c;
        }

        button:active {
            background: #7a1f1f;
            transform: scale(0.97);
        }

        button:disabled {
            background: #c4a46a;
            color: #9e7b4a;
            cursor: not-allowed;
        }

        button:disabled:hover {
            background: #c4a46a;
            transform: none;
        }

        #saveHanziList {
            margin-bottom: 12px;
        }

        #resetHistory {
            margin-top: 8px;
            margin-bottom: 8px;
            background: #b71c1c;
            font-size: 12px;
            padding: 6px 10px;
        }

        #resetHistory:hover {
            background: #7a1f1f;
        }

        #resetHistory:active {
            background: #5a1515;
            transform: scale(0.97);
        }

        #goToLastHanzi {
            margin-top: 8px;
            background: #7a1f1f;
        }

        #goToLastHanzi:hover {
            background: #5a1515;
        }

        #goToLastHanzi:active {
            background: #3b0d0d;
            transform: scale(0.97);
        }

        #lastHanziInfo {
            margin-top: 8px;
            font-size: 13px;
            color: #7a1f1f;
            text-align: center;
            min-height: 18px;
        }

        #presetBar {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 10px;
        }

        .preset-btn {
            width: auto;
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 3px;
        }

        .preset-default {
            background: #7a1f1f;
        }

        .preset-default:hover {
            background: #5a1515;
        }

        .preset-default:active {
            background: #3b0d0d;
            transform: scale(0.97);
        }

        .preset-item {
            display: inline-flex;
        }

        .preset-name {
            background: #7a1f1f;
            border-radius: 3px 0 0 3px;
        }

        .preset-name:hover {
            background: #5a1515;
        }

        .preset-name:active {
            background: #3b0d0d;
        }

        .preset-rename {
            background: #7a1f1f;
            border-radius: 0;
            border-left: 1px solid rgba(255,255,255,0.25);
            padding: 4px 7px;
            font-size: 11px;
        }

        .preset-rename:hover {
            background: #5a1515;
        }

        .preset-rename:active {
            background: #3b0d0d;
        }

        .preset-delete {
            background: #7a1f1f;
            border-radius: 0 3px 3px 0;
            border-left: 1px solid rgba(255,255,255,0.25);
            padding: 4px 8px;
            font-size: 13px;
            line-height: 1;
        }

        .preset-delete:hover {
            background: #5a1515;
        }

        .preset-delete:active {
            background: #3b0d0d;
        }

        .preset-default.preset-active {
            background: #d62828;
        }

        .preset-item.preset-active .preset-name,
        .preset-item.preset-active .preset-rename,
        .preset-item.preset-active .preset-delete {
            background: #d62828;
        }

        .preset-add {
            background: transparent;
            border: 2px dashed #d62828;
            color: #d62828;
            padding: 2px 10px;
        }

        .preset-add:hover {
            background: #fde8e8;
            transform: none;
        }

        .preset-add:active {
            background: #f9c4c4;
            transform: scale(0.97);
        }

        #ripenessSummary {
            margin-top: 8px;
            font-size: 11px;
            color: #7a1f1f;
            text-align: center;
            min-height: 14px;
        }

        #hanziGrid {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            margin-top: 4px;
            margin-bottom: 8px;
        }

        .hanzi-cell {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            font-size: 14px;
            border-radius: 3px;
            cursor: pointer;
            transition: opacity 0.1s;
        }

        .hanzi-cell:hover {
            opacity: 0.8;
        }

        #supportBtn {
            margin-top: 16px;
            background: transparent;
            border: 2px solid #d62828;
            color: #d62828;
            font-size: 15px;
            padding: 10px 12px;
            letter-spacing: 0.03em;
        }

        #supportBtn:hover {
            background: #fde8e8;
        }

        #supportBtn:active {
            background: #f9c4c4;
            transform: scale(0.97);
        }

        #hanziTooltip {
            display: none;
            position: fixed;
            background: #fff3cd;
            border: 2px solid #d62828;
            color: #7a1f1f;
            font-family: Arial, sans-serif;
            font-size: 12px;
            padding: 8px 10px;
            border-radius: 4px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.22);
            z-index: 9999;
            white-space: pre-line;
            text-align: center;
            pointer-events: none;
            max-width: 200px;
            line-height: 1.5;
        }

        #qrOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.72);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        #qrOverlay.open {
            display: flex;
        }

        #qrBox {
            background: #fff3cd;
            border: 4px solid #d62828;
            border-radius: 8px;
            padding: 20px 20px 16px;
            text-align: center;
            max-width: 260px;
            width: 90%;
        }

        #qrBox p {
            font-size: 15px;
            font-weight: bold;
            color: #7a1f1f;
            margin: 0 0 12px;
            line-height: 1.45;
        }

        #qrBox img {
            width: 100%;
            max-width: 200px;
            display: block;
            margin: 0 auto 14px;
            border: 2px solid #d62828;
            border-radius: 4px;
        }

        #closeQr {
            background: #d62828;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            padding: 10px 24px;
            border: 0;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        #closeQr:hover {
            background: #b71c1c;
        }

        #closeQr:active {
            background: #7a1f1f;
            transform: scale(0.97);
        }

    </style>
</head>
<body>
    <span class="textarea-label">학습할 한자 목록</span>
    <textarea id="hanziList" rows="5" cols="30" placeholder="한자를 쉼표로 구분하여 입력하세요"></textarea>
    <button id="saveHanziList">저장</button>
    <div id="presetBar"></div>
    <div id="ripenessSummary"></div>
    <div id="hanziGrid"></div>
    <button id="resetHistory">학습 기록 초기화</button>
    <div id="lastHanziInfo"></div>
    <button id="goToLastHanzi">마지막 학습 한자로 이동</button>
    <button id="supportBtn">🍚 開發者에게 後援하기</button>

    <div id="qrOverlay">
        <div id="qrBox">
            <p>후원은 개발자에게 큰 힘이 됩니다!</p>
            <img src="ShowMeTheMoneyQR.png" alt="후원 QR 코드">
            <button id="closeQr">닫기</button>
        </div>
    </div>

    <div id="hanziTooltip"></div>
    <script src="popup.js"></script>
</body>
</html>
